# 数据集配置文件
# train.py 通过此文件定位图片和标签

# 数据集根目录（相对于 01_training/）
path: dataset

# 训练集和验证集的子目录名
train: train
val:   val

# 类别数量
nc: 1

# 类别名称列表（与 shared/class_names.txt 保持一致）
names:
  - stain

# ── 说明 ─────────────────────────────────────────────────────────────────────
# 完整路径 = path / (train or val) / images or labels
# 即:
#   训练图片: dataset/train/images/*.jpg
#   训练标签: dataset/train/labels/*.txt
#   验证图片: dataset/val/images/*.jpg
#   验证标签: dataset/val/labels/*.txt
