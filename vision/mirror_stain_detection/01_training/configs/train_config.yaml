# 训练超参数配置

# ── 基础设置 ───────────────────────────────────────
img_size: 128        # 模型输入尺寸，不要改（ESP32-P4 限制）
batch_size: 16       # 显存不足时改为 8
num_workers: 0       # Windows 下多进程加载有时有问题，保持 0

# ── 训练周期 ───────────────────────────────────────
epochs: 100          # 数据集小时 50 即可，数据多可以到 200

# ── 优化器（SGD + Cosine LR）──────────────────────
lr: 0.01             # 初始学习率
momentum: 0.937
weight_decay: 0.0005

# ── 早停（可选）────────────────────────────────────
# early_stop_patience: 20   # 去掉 # 号启用，连续20轮无提升则停止

# ── 调试提示 ────────────────────────────────────────
# - 如果 loss 一直不下降，尝试降低 lr 到 0.001
# - 如果过拟合（val mAP 远低于 train），增加数据或减少 epochs
# - 如果数据集很小（< 100 张），建议用 lr: 0.001 + epochs: 200
